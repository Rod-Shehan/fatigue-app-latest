openapi: 3.0.3
info:
  title: Circadia Command API
  version: 1.0.0
  description: |
    Implemented routes on the Next.js app (same origin as `/triage`).

    **Roadmap (not implemented):** manager-validate, driver/respond, edge media presign, hardware provision.

servers:
  - url: /api/v1
    description: Triage and admin (session cookie)
  - url: /api/auth
    description: Authentication

paths:
  /auth/login:
    post:
      servers: [{ url: /api }]
      summary: Username + password sign-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Session cookie set
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      servers: [{ url: /api }]
      summary: Current operator session
      responses:
        "200":
          description: Authenticated operator
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      servers: [{ url: /api }]
      summary: Clear session
      responses:
        "200":
          description: Logged out

  /triage/queue:
    get:
      summary: Global active triage feed
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Queue page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /triage/claim:
    post:
      summary: Assign incident to operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimRequest"
      responses:
        "200":
          description: Incident locked to operator
        "409":
          description: ERR_INCIDENT_ALREADY_CLAIMED

  /triage/mutate:
    post:
      summary: Apply triage decision (F1/F2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriageMutateRequest"
      responses:
        "200":
          description: INTERVENTION_SENT or VERIFIED_FALSE_POSITIVE
        "202":
          description: MANAGER_VALIDATION_PENDING
        "409":
          $ref: "#/components/responses/IdempotencyConflict"

  /triage/stream:
    get:
      summary: SSE live incident feed (Postgres LISTEN)
      responses:
        "200":
          description: text/event-stream

  /admin/operators:
    get:
      summary: List operators (command_owner only)
      responses:
        "200":
          description: Operator list
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Create operator (command_owner only)
      responses:
        "201":
          description: Created

  /admin/operators/{operatorId}:
    patch:
      summary: Update operator password, role, or active flag
      parameters:
        - name: operatorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated

components:
  responses:
    Unauthorized:
      description: Missing or invalid session
    Forbidden:
      description: IP not whitelisted or insufficient role
    IdempotencyConflict:
      description: ERR_STATE_CONCURRENCY_VIOLATION
  schemas:
    QueueResponse:
      type: object
      properties:
        queue_depth:
          type: integer
        incidents:
          type: array
          items:
            $ref: "#/components/schemas/Incident"
        pagination:
          type: object
          properties:
            next_cursor:
              type: string
            has_more:
              type: boolean
    Incident:
      type: object
      properties:
        lifecycle_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        vehicle_registration:
          type: string
        fatigue_metric_type:
          type: string
        confidence_score:
          type: number
        detected_at:
          type: string
          format: date-time
        video_snippet_url:
          type: string
        lock_holder_id:
          type: string
          format: uuid
          nullable: true
    ClaimRequest:
      type: object
      required: [lifecycle_id]
      properties:
        lifecycle_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
    TriageMutateRequest:
      type: object
      required: [lifecycle_id, action, idempotency_key]
      properties:
        lifecycle_id:
          type: string
          format: uuid
        action:
          type: string
          enum: [VERIFIED_TRUE_FATIGUE, VERIFIED_FALSE_POSITIVE]
        idempotency_key:
          type: string
        operator_notes:
          type: string
