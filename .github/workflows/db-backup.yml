# Nightly encrypted Neon pg_dump → Cloudflare R2 (electronic SoR off-site copy).
# Doctrine: app-next/docs/product/hot-cold-record-access-project-scope.md
# Restore: app-next/docs/ops/db-backup-restore.md
#
# Secrets (GitHub → Settings → Secrets and variables → Actions):
#   DATABASE_URL_UNPOOLED   — Neon direct URL (no -pooler); sslmode=require
#   BACKUP_ENCRYPTION_KEY   — long random passphrase for OpenSSL AES-256-CBC
#   R2_ACCOUNT_ID
#   R2_ACCESS_KEY_ID
#   R2_SECRET_ACCESS_KEY
#   R2_BUCKET_NAME          — dedicated backups bucket (not checklist/evidence)

name: Neon DB backup to R2

on:
  schedule:
    # 16:00 UTC ≈ 00:00 AWST (Perth midnight). Adjust if owner prefers another window.
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Neon production is Postgres 17 — pg_dump major must match (or be newer).
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" | sudo tee /etc/paths.d/postgresql-17 >/dev/null || true
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          which pg_dump
          pg_dump --version
          test -x /usr/lib/postgresql/17/bin/pg_dump

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: scripts/db-backup/package-lock.json

      - name: Install backup uploader deps
        working-directory: scripts/db-backup
        run: npm ci

      - name: Dump, encrypt, upload
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          PG_DUMP: /usr/lib/postgresql/17/bin/pg_dump
        run: |
          set -euo pipefail

          for name in DATABASE_URL_UNPOOLED BACKUP_ENCRYPTION_KEY R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name"
              exit 1
            fi
          done

          # Refuse pooler hostnames — pg_dump must use Neon direct endpoint.
          if echo "$DATABASE_URL_UNPOOLED" | grep -qi 'pooler'; then
            echo "DATABASE_URL_UNPOOLED looks pooled (contains 'pooler'). Use the direct Neon URL."
            exit 1
          fi

          if [ ! -x "$PG_DUMP" ]; then
            echo "PostgreSQL 17 pg_dump not found at $PG_DUMP"
            exit 1
          fi
          "$PG_DUMP" --version

          STAMP=$(date -u +"%Y-%m-%d_%H-%M-%S")
          WORK_DIR="${RUNNER_TEMP}/circadia-db-backup"
          mkdir -p "$WORK_DIR"
          DUMP_PATH="${WORK_DIR}/${STAMP}.dump"
          ENC_PATH="${WORK_DIR}/${STAMP}.dump.enc"
          OBJECT_KEY="backups/${STAMP}.dump.enc"

          echo "Running pg_dump -Fc (custom format)…"
          "$PG_DUMP" -Fc --no-owner --no-acl -f "$DUMP_PATH" "$DATABASE_URL_UNPOOLED"

          echo "Encrypting with OpenSSL AES-256-CBC (PBKDF2)…"
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in "$DUMP_PATH" \
            -out "$ENC_PATH" \
            -pass env:BACKUP_ENCRYPTION_KEY

          rm -f "$DUMP_PATH"

          export BACKUP_FILE_PATH="$ENC_PATH"
          export R2_OBJECT_KEY="$OBJECT_KEY"
          npm --prefix scripts/db-backup run upload

          rm -f "$ENC_PATH"
          echo "Backup complete: s3://${R2_BUCKET_NAME}/${OBJECT_KEY}"
