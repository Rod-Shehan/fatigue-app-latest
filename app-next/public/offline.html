<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Circadia24 — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        padding: 1.5rem;
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.75rem;
      }
      p {
        font-size: 0.95rem;
        line-height: 1.5;
        color: #94a3b8;
        margin: 0 0 1.25rem;
      }
      a {
        display: inline-block;
        padding: 0.75rem 1.25rem;
        border-radius: 0.75rem;
        background: #0d9488;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>
        Open Circadia24 from your home screen, or reconnect and try again. Your saved weeks stay on this
        device.
      </p>
      <a href="/driver">Go to Drive home</a>
    </main>
  </body>
</html>
